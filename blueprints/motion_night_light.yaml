blueprint:
  name: Motion Night Light Timer
  description: Turns on a light at night based on motion, and waits a custom amount of time after the last motion to turn it off.
  domain: automation
  input:
    motion_sensor:
      name: Motion Sensor
      description: The sensor that triggers the light.
      selector:
        entity:
          domain: binary_sensor
          device_class: motion
    target_light:
      name: Light
      description: The light to turn on and off.
      selector:
        entity:
          domain: light
    wait_time:
      name: Wait Time (Minutes)
      description: How long to wait after the last detected motion before turning the light off.
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

mode: single

trigger:
  - trigger: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_detected
  - trigger: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      minutes: !input wait_time
    id: motion_cleared

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: motion_detected
          - condition: state
            entity_id: sun.sun
            state: "below_horizon"
          - condition: state
            entity_id: !input target_light
            state: "off"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input target_light
      - conditions:
          - condition: trigger
            id: motion_cleared
          - condition: state
            entity_id: !input target_light
            state: "on"
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input target_light
