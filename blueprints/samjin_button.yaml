blueprint:
  name: ZHA - Samjin / SmartThings Button
  description: Automate actions for Single Press, Double Press, and Hold on a Samjin (SmartThings) button via ZHA.
  domain: automation
  input:
    samjin_button:
      name: Select Samjin Button
      description: The Samjin or SmartThings button device.
      selector:
        device:
          integration: zha
          manufacturer: Samjin
    button_short_press:
      name: Single Short Press
      description: Action to run on a single press.
      default: []
      selector:
        action: {}
    button_double_press:
      name: Double Press
      description: Action to run on a double press.
      default: []
      selector:
        action: {}
    button_long_press:
      name: Hold / Long Press
      description: Action to run when held down.
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input samjin_button

action:
  - variables:
      # Handle both payload styles (params dictionary or args list/dict)
      press_type: >-
        {% if trigger.event.data.params is defined and trigger.event.data.params.press_type is defined %}
          {{ trigger.event.data.params.press_type }}
        {% elif trigger.event.data.args is defined and trigger.event.data.args is mapping and 'press_type' in trigger.event.data.args %}
          {{ trigger.event.data.args.press_type }}
        {% else %}
          unknown
        {% endif %}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ press_type == 'single' }}"
        sequence: !input button_short_press

      - conditions:
          - condition: template
            value_template: "{{ press_type == 'double' }}"
        sequence: !input button_double_press

      - conditions:
          - condition: template
            value_template: "{{ press_type == 'hold' }}"
        sequence: !input button_long_press
